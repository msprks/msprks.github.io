    <button class="gallery-scroll-button gallery-scroll-left" type="button" aria-label="Scroll images to the left">←</button>
    <button class="gallery-scroll-button gallery-scroll-right" type="button" aria-label="Scroll images to the right">→</button>

    <script>
      const gallery = document.querySelector('.exhibition-gallery');
      const leftButton = document.querySelector('.gallery-scroll-left');
      const rightButton = document.querySelector('.gallery-scroll-right');

      const updateArrows = () => {
        leftButton.classList.toggle('is-hidden', gallery.scrollLeft <= 2);
        rightButton.classList.toggle('is-hidden', gallery.scrollLeft + gallery.clientWidth >= gallery.scrollWidth - 2);
      };

      gallery.addEventListener('scroll', updateArrows, { passive: true });
      window.addEventListener('resize', updateArrows);
      updateArrows();

      document.querySelector('.gallery-scroll-left').addEventListener('click', () => {
        gallery.scrollBy({ left: -gallery.clientWidth * 0.8, behavior: 'smooth' });
      });

      document.querySelector('.gallery-scroll-right').addEventListener('click', () => {
        gallery.scrollBy({ left: gallery.clientWidth * 0.8, behavior: 'smooth' });
      });
    </script>
