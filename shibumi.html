          <svg class="seated-figure-color-filters" width="0" height="0" aria-hidden="true" focusable="false">

            <filter id="shibumi-blue-still-1" x="0" y="0" width="100%" height="100%" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">

            <filter id="shibumi-blue-still-2" x="0" y="0" width="100%" height="100%" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">

                       href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 225 400'%3E%3Cpath d='M0 0H35L40 101 36 111 26 122 19 136 17 158 12 175 0 191Z'/%3E%3C/svg%3E"/>
              <feColorMatrix in="SourceGraphic" values="1 0 0 0 .004  0 1 0 0 .004  0 0 1 0 .016  0 0 0 1 0" result="matched"/>
              <feComposite in="matched" in2="fabric" operator="in"/>
