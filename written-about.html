<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="M.E. Sparks">
    <title>Written about — M.E. Sparks</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    <script>
      function hide(elementId) {
        const element = document.getElementById(elementId);
        element.style.display = "none";
        if (elementId === 'writing-links') {
          element.querySelectorAll('[aria-current="page"]').forEach((link) => link.removeAttribute('aria-current'));
        }
      }
      function toggle(elementId) {
        const element = document.getElementById(elementId);
        element.style.display = element.style.display === "none" ? "inline-block" : "none";
      }
      function activateInfoLink(element) {
        document.querySelectorAll('.info-action-group > .info-link').forEach((link) => link.classList.remove('is-active'));
        element.classList.add('is-active');
      }
    </script>
  </head>
  <body class="info-page writing-page">
    <header class="top-bar">
      <a class="site-title" href="index.html">M.E. Sparks</a>
      <nav class="site-navigation" aria-label="Main navigation">
        <a href="index.html">painting</a>
        <a href="video.html">video</a>
        <a href="otherprojects.html">projects</a>
        <a href="info.html" aria-current="page">about</a>
        <div class="info-actions exhibition-text-nav info-navigation-actions">
          <div class="info-action-group">
            <a class="info-link" href="info.html#contact">contact</a>
            <span id="contact-details" style="display:none;"><span class="toggles" id="email"><code>m.eliz.sparks</code>&#64;gmail&#46;com</span><a id="insta" class="info-link toggles" target="_blank" rel="noopener noreferrer" href="https://www.instagram.com/msprks/">@msprks</a></span>
          </div>
          <div class="info-action-group">
            <a class="info-link" href="info.html#cv">cv</a>
            <a class="info-link toggles" id="CV" style="display:none;" target="_blank" rel="noopener noreferrer" href="web_Sparks_CV2026.pdf">download</a>
          </div>
          <div class="info-action-group">
            <button class="info-link is-active" type="button" onclick="hide('CV');hide('contact-details');toggle('writing-links');activateInfoLink(this)">text</button>
            <span id="writing-links" class="writing-links" style="display:inline-block;"><a class="info-link" href="written-about.html" aria-current="page">written about</a><a class="info-link" href="written-by.html">written by</a></span>
          </div>
          <span class="texts-coming-soon-row"><span class="texts-coming-soon">texts coming soon</span></span>
        </div>
      </nav>
    </header>
    <div class="site-header-spacer"></div>
  </body>
</html>
